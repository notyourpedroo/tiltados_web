<script>
  const frames = [...document.querySelectorAll("iframe[data-src]")];
  // Ajusta cada quadro à altura do conteúdo (servido por HTTP; aberto como arquivo,
  // fica a altura declarada na prévia).
  frames.forEach((f) =>
    f.addEventListener("load", () => {
      try {
        f.style.height = f.contentDocument.documentElement.scrollHeight + "px";
      } catch {}
    }),
  );
  const setTheme = (theme) => {
    document.documentElement.dataset.theme = theme;
    document.querySelectorAll("[data-theme-btn]").forEach((b) => b.classList.toggle("on", b.dataset.themeBtn === theme));
    frames.forEach((f) => (f.src = f.dataset.src + "?theme=" + theme));
  };
  document.querySelectorAll("[data-theme-btn]").forEach((b) =>
    b.addEventListener("click", (e) => { e.preventDefault(); setTheme(b.dataset.themeBtn); }),
  );
  setTheme("dark");
</script>
