<title>TeamDrivers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
.drivers { list-style: none; margin: 0; padding: 0; }
.drivers li { display: flex; align-items: center; gap: 8px; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line); }
.drivers li:first-child { border-top: 0; }
.drivers a { color: var(--text-2); font-weight: 900; text-decoration: none; }
.drivers .in-dupla a { font-size: 18px; line-height: 28px; color: var(--text); }
.drivers .pts { margin-left: auto; font-weight: 700; }
</style>
</head>
<body>
<div class="demo"><div class="card" style="max-width:440px">
  <ul class="drivers">
    <li class="in-dupla"><a>Matheus</a><span class="badge-sprint">Dupla</span><span class="pts tabular">312 <span class="c-muted" style="font-size:12px;font-weight:400">pts</span></span></li>
    <li class="in-dupla"><a>Gabriel</a><span class="badge-sprint">Dupla</span><span class="pts tabular">164 <span class="c-muted" style="font-size:12px;font-weight:400">pts</span></span></li>
    <li><a>Lucas</a><span class="pts tabular">23 <span class="c-muted" style="font-size:12px;font-weight:400">pts</span></span></li>
  </ul>
</div></div>
</body>
