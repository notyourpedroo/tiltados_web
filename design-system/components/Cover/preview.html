<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || "dark";</script>
<title>Tiltados F1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;900&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  /* a composição: a caixa de 480px à direita do layout de 960, longe do nome */
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--accent); }
  .gold { fill: var(--gold-fill); }
  .silver { fill: var(--silver-fill); }
  .bronze { fill: var(--bronze-fill); }
  .step { rx: var(--radius-sm); }
  /* nome e frase no canto inferior esquerdo, sobre o fundo */
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 88px; line-height: .95; font-weight: 900; font-style: italic; letter-spacing: -.025em; color: var(--text); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocos      accent 400×120, inclinado −12° como o bloco do logotipo, saindo pelo topo e pela direita (a cor mais lembrada da marca, a maior área) · pódio silver-fill 96×112, gold-fill 96×160, bronze-fill 96×80 na ordem 2-1-3, saindo pela base · ≈29% de 960×288
        arranjo     uma laje inclinada no alto com o pódio escalonado abaixo dela, o topo do 1º lugar a space-6 da laje
        padrão      faixas, da textura stripe dos cards de destaque e da inclinação do logotipo ("noticiário de pista"): 11 faixas de 4px em accent, passo space-3, mesma inclinação de −12° da laje
        escalas     larguras múltiplas de space-2 (96 = 12×); vão do pódio space-2; distância laje-pódio space-6; cantos radius-sm
      -->
      <polygon class="brand" points="106,-8 488,-8 488,112 80,112" />
      <g class="brand">
        <polygon points="48,136 52,136 20,296 16,296" />
        <polygon points="60,136 64,136 32,296 28,296" />
        <polygon points="72,136 76,136 44,296 40,296" />
        <polygon points="84,136 88,136 56,296 52,296" />
        <polygon points="96,136 100,136 68,296 64,296" />
        <polygon points="108,136 112,136 80,296 76,296" />
        <polygon points="120,136 124,136 92,296 88,296" />
        <polygon points="132,136 136,136 104,296 100,296" />
        <polygon points="144,136 148,136 116,296 112,296" />
        <polygon points="156,136 160,136 128,296 124,296" />
        <polygon points="168,136 172,136 140,296 136,296" />
      </g>
      <rect class="silver step" x="168" y="184" width="96" height="112" />
      <rect class="gold step" x="272" y="136" width="96" height="160" />
      <rect class="bronze step" x="376" y="216" width="96" height="80" />
    </svg>
  </div>
  <div class="words">
    <p class="name">Tiltados<br>F1</p>
    <p class="tag">Resultados, classificações e estatísticas da liga Tiltados de F1 virtual.</p>
  </div>
</div>
</body>
</html>
