<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || "dark";</script>
<title>ThemeToggle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
.t { display: inline-flex; align-items: center; gap: var(--space-2); margin-right: var(--space-4); }
.cap { font-size: 12px; line-height: 16px; color: var(--muted); }
.theme-btn { display: flex; width: 32px; height: 32px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: var(--radius-full); background: none; color: var(--text-2); }
</style>
</head>
<body>
<div class="demo"><div class="row">
  <span class="t"><button class="theme-btn" aria-label="Tema automático"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button><span class="cap">Automático</span></span>
  <span class="t"><button class="theme-btn" aria-label="Tema claro"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><span class="cap">Claro</span></span>
  <span class="t"><button class="theme-btn" aria-label="Tema escuro"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button><span class="cap">Escuro</span></span>
</div></div>
</body>
</html>
